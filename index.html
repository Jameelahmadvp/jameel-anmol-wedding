<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

<title>Jameel & Anmol Wedding Invitation</title>

<meta property="og:title" content="Jameel & Anmol Wedding Invitation">
<meta property="og:description" content="Muhammad Jameel Ahmad & Anmol Fatimaa">
<meta property="og:image" content="https://jameelahmadvp.github.io/jameel-anmol-wedding/coverpng.png">
<meta property="og:url" content="https://jameelahmadvp.github.io/jameel-anmol-wedding/">
<meta property="og:type" content="website">
<meta name="theme-color" content="#fff7e8">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #fff7e8;
}

body {
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
  user-select: none;
  -webkit-user-select: none;
}

#book {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  height: 100dvh;
  overflow: hidden;
  background: #fff7e8;
  touch-action: pan-y;
}

.page {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #fff7e8;
  isolation: isolate;
}

.page.active {
  display: flex;
}

.page::before {
  content: "";
  position: absolute;
  inset: -25px;
  z-index: -2;
  background-image: var(--page-image);
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;
  filter: blur(18px);
  opacity: 0.42;
  transform: scale(1.05);
}

.page::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background: rgba(255, 247, 232, 0.30);
}

.page img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
  pointer-events: none;
  -webkit-user-drag: none;
}

/* Stronger cover shake */
.page.cover.active img {
  animation: coverShake 3s ease-in-out 2s infinite;
  transform-origin: center;
}

@keyframes coverShake {
  0%, 55%, 100% {
    transform: translateX(0) rotate(0);
  }
  60% {
    transform: translateX(-18px) rotate(-1.5deg);
  }
  65% {
    transform: translateX(18px) rotate(1.5deg);
  }
  70% {
    transform: translateX(-14px) rotate(-1deg);
  }
  75% {
    transform: translateX(14px) rotate(1deg);
  }
  80% {
    transform: translateX(-7px);
  }
  85% {
    transform: translateX(7px);
  }
  90% {
    transform: translateX(0) rotate(0);
  }
}

@media (prefers-reduced-motion: reduce) {
  .page.cover.active img {
    animation: none;
  }
}
</style>
</head>

<body>
<main id="book">

  <section class="page cover active">
    <img src="Page%201.png" alt="Wedding invitation cover" draggable="false">
  </section>

  <section class="page">
    <img src="Page%202.png" alt="Baraat invitation" draggable="false">
  </section>

  <section class="page">
    <img src="Page%203.png" alt="Walima invitation" draggable="false">
  </section>

</main>

<script>
const book = document.getElementById("book");
const pages = Array.from(document.querySelectorAll(".page"));

let currentPage = 0;
let startX = 0;
let startY = 0;
let startTime = 0;
let pointerActive = false;

function preparePages() {
  pages.forEach((page) => {
    const img = page.querySelector("img");

    page.style.setProperty(
      "--page-image",
      'url("' + img.getAttribute("src") + '")'
    );

    const preload = new Image();
    preload.src = img.src;
  });
}

function showPage(index) {
  if (index < 0 || index >= pages.length) return;

  pages[currentPage].classList.remove("active");
  currentPage = index;
  pages[currentPage].classList.add("active");
}

/* Touch swipe: both directions */
book.addEventListener("touchstart", function(event) {
  if (event.touches.length !== 1) return;

  const touch = event.touches[0];
  startX = touch.clientX;
  startY = touch.clientY;
  startTime = Date.now();
  pointerActive = true;
}, { passive: true });

book.addEventListener("touchend", function(event) {
  if (!pointerActive) return;
  pointerActive = false;

  const touch = event.changedTouches[0];
  const diffX = touch.clientX - startX;
  const diffY = touch.clientY - startY;
  const elapsed = Date.now() - startTime;

  if (Math.abs(diffX) < 35) return;
  if (Math.abs(diffX) <= Math.abs(diffY)) return;
  if (elapsed > 1200) return;

  if (diffX < 0) {
    // Swipe left: next page
    showPage(currentPage + 1);
  } else {
    // Swipe right: previous page
    showPage(currentPage - 1);
  }
}, { passive: true });

book.addEventListener("touchcancel", function() {
  pointerActive = false;
});

/* Mouse dragging on computers */
let mouseDown = false;
let mouseStartX = 0;
let mouseStartY = 0;

book.addEventListener("mousedown", function(event) {
  mouseDown = true;
  mouseStartX = event.clientX;
  mouseStartY = event.clientY;
});

document.addEventListener("mouseup", function(event) {
  if (!mouseDown) return;
  mouseDown = false;

  const diffX = event.clientX - mouseStartX;
  const diffY = event.clientY - mouseStartY;

  if (Math.abs(diffX) < 35) return;
  if (Math.abs(diffX) <= Math.abs(diffY)) return;

  if (diffX < 0) {
    showPage(currentPage + 1);
  } else {
    showPage(currentPage - 1);
  }
});

/* Keyboard support */
document.addEventListener("keydown", function(event) {
  if (event.key === "ArrowRight" || event.key === "ArrowDown") {
    showPage(currentPage + 1);
  }

  if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
    showPage(currentPage - 1);
  }
});

preparePages();
</script>
</body>
</html>
