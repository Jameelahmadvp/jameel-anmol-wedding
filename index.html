<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Jameel & Anmol | Wedding Invitation</title>
<meta name="theme-color" content="#fff7e9">
<meta name="description" content="Wedding invitation of Jameel Ahmad and Anmol Fatima.">

<meta property="og:title" content="Jameel & Anmol — Wedding Invitation">
<meta property="og:description" content="You are cordially invited to celebrate our wedding.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://jameelahmadvp.github.io/jameel-anmol-wedding/">
<meta property="og:image" content="https://jameelahmadvp.github.io/jameel-anmol-wedding/coverpng.png">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #fff7e9;
}

body {
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
  user-select: none;
  -webkit-user-select: none;
}

#book {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  height: 100dvh;
  overflow: hidden;
  background: #fff7e9;
  touch-action: pan-y;
}

.page {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: none;
  overflow: hidden;
  background: #fff7e9;
}

.page.active {
  display: flex;
  align-items: center;
  justify-content: center;
  animation: showPage .25s ease-out;
}

.page img {
  display: block;

  /* Fill the complete mobile screen */
  width: 100%;
  height: 100%;
  max-width: none;
  max-height: none;

  /* Keep artwork proportional; no stretching */
  object-fit: contain;
  object-position: center center;

  pointer-events: none;
  -webkit-user-drag: none;
}

@keyframes showPage {
  from { opacity: .7; }
  to { opacity: 1; }
}

@media (prefers-reduced-motion: reduce) {
  .page.active {
    animation: none;
  }
}
</style>
</head>

<body>
<main id="book">

  <section class="page active" aria-label="Main wedding invitation">
    <img
      src="Page%201.png"
      alt="Jameel and Anmol wedding invitation"
      draggable="false">
  </section>

  <section class="page" aria-label="Baraat invitation">
    <img
      src="Page%202.png"
      alt="Baraat details"
      draggable="false">
  </section>

  <section class="page" aria-label="Walima invitation">
    <img
      src="Page%203.png"
      alt="Walima details"
      draggable="false">
  </section>

</main>

<script>
(() => {
  const book = document.getElementById("book");
  const pages = Array.from(document.querySelectorAll(".page"));

  let current = 0;
  let startX = 0;
  let startY = 0;
  let startTime = 0;
  let animating = false;

  function showPage(next) {
    if (
      animating ||
      next < 0 ||
      next >= pages.length ||
      next === current
    ) return;

    animating = true;
    pages[current].classList.remove("active");
    current = next;
    pages[current].classList.add("active");

    setTimeout(() => {
      animating = false;
    }, 270);
  }

  book.addEventListener("touchstart", event => {
    if (event.touches.length !== 1) return;

    startX = event.touches[0].clientX;
    startY = event.touches[0].clientY;
    startTime = Date.now();
  }, { passive: true });

  book.addEventListener("touchend", event => {
    if (event.changedTouches.length !== 1) return;

    const dx = event.changedTouches[0].clientX - startX;
    const dy = event.changedTouches[0].clientY - startY;
    const elapsed = Date.now() - startTime;

    if (
      elapsed > 800 ||
      Math.abs(dx) < 40 ||
      Math.abs(dx) < Math.abs(dy) * 1.2
    ) return;

    if (dx < 0) showPage(current + 1);
    else showPage(current - 1);
  }, { passive: true });

  document.addEventListener("keydown", event => {
    if (event.key === "ArrowRight") showPage(current + 1);
    if (event.key === "ArrowLeft") showPage(current - 1);
  });

  /* Preload both event pages */
  pages.forEach(page => {
    const img = page.querySelector("img");
    const preload = new Image();
    preload.src = img.src;
  });
})();
</script>

</body>
</html>
