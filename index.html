<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f1e7">
<title>Muhammad Jameel Ahmad & Anmol Fatimaa

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --gold: #b18a3c;
  --dark-gold: #73552c;
  --ink: #342820;
  --paper: #fffdf8;
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--paper);
  font-family: 'Montserrat', sans-serif;
  overscroll-behavior: none;
}

body {
  color: var(--ink);
}

.booklet {
  position: relative;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  background: var(--paper);
  touch-action: pan-y;
}

.page {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  padding:
    max(12px, env(safe-area-inset-top))
    12px
    max(12px, env(safe-area-inset-bottom));
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: #f7f1e7;
  transform: translateX(100%);
  visibility: hidden;
  z-index: 0;
  transition:
    transform .55s cubic-bezier(.22,.72,.2,1),
    visibility 0s linear .55s;
}

.page.active {
  transform: translateX(0);
  visibility: visible;
  z-index: 2;
  transition:
    transform .55s cubic-bezier(.22,.72,.2,1),
    visibility 0s;
}

.page.past {
  transform: translateX(-100%);
  visibility: hidden;
  z-index: 1;
}

.paper {
  position: relative;
  width: 100%;
  height: 100%;
  max-width: 650px;
  max-height: 100%;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 24px 20px;
  background: var(--paper);
  border: 1px solid #c8b99f;
}

.paper::before {
  content: "";
  position: absolute;
  inset: 8px;
  border: 1px solid #d9cbb5;
  pointer-events: none;
}

.paper::after {
  content: "";
  position: absolute;
  inset: 14px;
  border: 1px solid #eee3d2;
  pointer-events: none;
}

.inner {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 460px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

/* COVER PHOTO */

.cover .paper {
  background: #f3e7d4;
  border-color: #bca57e;
}

.cover-photo {
  position: absolute;
  inset: 0;
  background-image: url("angan-scene.jpg");
  background-position: center;
  background-size: cover;
  transform: scale(1.02);
  animation: slowZoom 25s ease-in-out infinite alternate;
}

.cover-photo::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    180deg,
    rgba(255,248,235,.76) 0%,
    rgba(255,248,235,.60) 48%,
    rgba(255,248,235,.78) 100%
  );
}

.cover .paper::before {
  border-color: rgba(164,126,67,.65);
}

.cover .paper::after {
  border-color: rgba(255,255,255,.8);
}

/* COVER TYPOGRAPHY */

.gold-bismillah {
  font-family: serif;
  font-size: clamp(23px, 6vw, 32px);
  color: var(--gold);
  line-height: 1.9;
  margin-bottom: 9px;
  text-shadow: 0 1px 1px #fff;
}

.parent-name {
  font-size: clamp(13px, 3.4vw, 16px);
  font-weight: 700;
  line-height: 1.5;
  color: #FFD700;
  margin: 2px 0 7px;
}

.invitation-line {
  font-size: clamp(10px, 2.8vw, 12px);
  line-height: 1.65;
  color: #FFD700;
  margin: 1px 0 4px;
}

.ceremony-heading {
  font-size: clamp(13px, 3.6vw, 16px);
  font-weight: 700;
  letter-spacing: .8px;
  line-height: 1.5;
  color: #FFD700;
  margin: 2px 0 6px;
}

.small-line {
  font-family: 'Cormorant Garamond', serif;
  font-size: 17px;
  color: #70573b;
  margin-bottom: 4px;
}

.cover-name {
  font-family: 'Great Vibes', cursive;
  font-size: clamp(34px, 8.6vw, 47px);
  font-weight: 400;
  line-height: 1.25;
  color: #FFD700;
  margin: 4px 0;
}

.cover-with {
  font-size: 12px;
  font-weight: 600;
  margin: 3px 0;
  color: #795a34;
}

.bride-parents {
  font-size: clamp(9px, 2.5vw, 11px);
  font-weight: 600;
  line-height: 1.55;
  color: #49351f;
  margin-top: 3px;
}

.gold-line {
  width: 88px;
  height: 1px;
  background: var(--gold);
  margin: 9px auto;
}

.rsvp-heading,
.contact-heading {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .6px;
  margin-top: 3px;
  color: #49351f;
}

.rsvp-name,
.rsvp-note,
.contact-number {
  font-size: clamp(9px, 2.35vw, 10.5px);
  line-height: 1.55;
  color: #594531;
}

.contact-heading {
  margin-top: 7px;
}

/* EVENT PAGES */

.event-page .paper {
  background:
    linear-gradient(rgba(255,253,248,.92),rgba(255,253,248,.92)),
    url("angan-scene.jpg") center/cover no-repeat;
}

.event-inner {
  padding: 12px 0;
}

.event-kicker {
  font-size: 10px;
  letter-spacing: 2.5px;
  line-height: 1.8;
  text-transform: uppercase;
  color: #82673e;
  margin-bottom: 7px;
}

.event-title {
  font-family: 'Great Vibes', cursive;
  font-size: clamp(50px, 13vw, 68px);
  font-weight: 400;
  line-height: 1.2;
  color: #49351f;
  margin: 0 0 5px;
}

.event-intro {
  font-family: 'Cormorant Garamond', serif;
  font-size: 19px;
  line-height: 1.5;
  color: #765f47;
  margin: 4px 0 15px;
}

.event-date {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(20px, 5.5vw, 27px);
  line-height: 1.5;
  color: #3c3025;
  margin: 4px 0;
}

.event-time {
  font-size: 12px;
  letter-spacing: 2px;
  color: #69513a;
  margin: 7px 0 22px;
}

.venue-label {
  font-size: 9px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #82673e;
  margin-bottom: 6px;
}

.venue-name {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 600;
  font-size: clamp(28px, 7.4vw, 37px);
  line-height: 1.25;
  color: #3c3025;
  margin: 3px 0 7px;
}

.venue-address {
  font-size: 12px;
  line-height: 1.9;
  color: #655548;
}

.event-names {
  font-family: 'Great Vibes', cursive;
  font-size: clamp(30px, 8vw, 39px);
  line-height: 1.3;
  color: #8b6939;
  margin-top: 23px;
}

@keyframes slowZoom {
  from { transform: scale(1.02); }
  to { transform: scale(1.09); }
}

@media (max-width: 380px) {
  .page {
    padding-left: 9px;
    padding-right: 9px;
  }

  .paper {
    padding: 18px 15px;
  }

  .gold-bismillah {
    font-size: 23px;
    margin-bottom: 5px;
  }

  .cover-name {
    font-size: 34px;
  }

  .gold-line {
    margin: 7px auto;
  }

  .event-intro {
    margin-bottom: 10px;
  }

  .event-time {
    margin-bottom: 16px;
  }

  .event-names {
    margin-top: 17px;
  }
}

@media (max-height: 700px) {
  .paper {
    padding-top: 13px;
    padding-bottom: 13px;
  }

  .gold-bismillah {
    font-size: 22px;
    margin-bottom: 2px;
  }

  .parent-name {
    margin-bottom: 3px;
  }

  .cover-name {
    font-size: 31px;
    margin: 2px 0;
  }

  .gold-line {
    margin: 5px auto;
  }

  .contact-heading {
    margin-top: 3px;
  }

  .event-time {
    margin-bottom: 12px;
  }

  .event-names {
    margin-top: 13px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .page {
    transition-duration: .2s;
  }

  .cover-photo {
    animation: none;
  }
}
</style>
</head>

<body>

<script>
(() => {
  const booklet = document.getElementById("booklet");
  const pages = Array.from(document.querySelectorAll(".page"));

  let current = 0;
  let startX = 0;
  let startY = 0;
  let tracking = false;
  let animating = false;

  function initialisePages() {
    pages.forEach((page, index) => {
      page.classList.remove("active", "past");
      page.style.visibility = index === 0 ? "visible" : "hidden";
      page.style.transform =
        index === 0 ? "translateX(0)" : "translateX(100%)";

      if (index === 0) {
        page.classList.add("active");
      }
    });
  }

  function showPage(target) {
    if (
      animating ||
      target < 0 ||
      target >= pages.length ||
      target === current
    ) return;

    animating = true;

    const outgoing = pages[current];
    const incoming = pages[target];
    const direction = target > current ? 1 : -1;

    incoming.style.transition = "none";
    incoming.style.visibility = "visible";
    incoming.style.zIndex = "3";
    incoming.style.transform =
      direction > 0 ? "translateX(100%)" : "translateX(-100%)";

    void incoming.offsetWidth;

    incoming.style.transition = "";
    incoming.style.transform = "translateX(0)";

    outgoing.style.transform =
      direction > 0 ? "translateX(-100%)" : "translateX(100%)";

    outgoing.classList.remove("active");
    outgoing.classList.add("past");

    current = target;
    incoming.classList.remove("past");
    incoming.classList.add("active");

    window.setTimeout(() => {
      pages.forEach((page, index) => {
        page.style.zIndex = "";

        if (index === current) {
          page.classList.add("active");
          page.classList.remove("past");
          page.style.visibility = "visible";
          page.style.transform = "translateX(0)";
        } else if (index < current) {
          page.classList.remove("active");
          page.classList.add("past");
          page.style.visibility = "hidden";
          page.style.transform = "translateX(-100%)";
        } else {
          page.classList.remove("active", "past");
          page.style.visibility = "hidden";
          page.style.transform = "translateX(100%)";
        }

        page.style.transition = "";
      });

      animating = false;
    }, 570);
  }

  booklet.addEventListener("touchstart", event => {
    if (event.touches.length !== 1) return;

    const touch = event.touches[0];
    startX = touch.clientX;
    startY = touch.clientY;
    tracking = true;
  }, { passive: true });

  booklet.addEventListener("touchend", event => {
    if (!tracking) return;
    tracking = false;

    const touch = event.changedTouches[0];
    const dx = touch.clientX - startX;
    const dy = touch.clientY - startY;

    if (Math.abs(dx) < 45 || Math.abs(dx) < Math.abs(dy) * 1.2) {
      return;
    }

    if (dx < 0) {
      showPage(current + 1);
    } else {
      showPage(current - 1);
    }
  }, { passive: true });

  let mouseDown = false;

  booklet.addEventListener("mousedown", event => {
    mouseDown = true;
    startX = event.clientX;
    startY = event.clientY;
  });

  window.addEventListener("mouseup", event => {
    if (!mouseDown) return;
    mouseDown = false;

    const dx = event.clientX - startX;
    const dy = event.clientY - startY;

    if (Math.abs(dx) < 55 || Math.abs(dx) < Math.abs(dy)) return;

    showPage(current + (dx < 0 ? 1 : -1));
  });

  document.addEventListener("keydown", event => {
    if (event.key === "ArrowRight") showPage(current + 1);
    if (event.key === "ArrowLeft") showPage(current - 1);
  });

  initialisePages();
})();
</script>
</body>
</html>
