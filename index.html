<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

<title>Jameel & Anmol Wedding Invitation</title>

<meta property="og:title" content="Jameel & Anmol Wedding Invitation">
<meta property="og:description" content="Muhammad Jameel Ahmad & Anmol Fatimaa">
<meta property="og:image" content="https://jameelahmadvp.github.io/jameel-anmol-wedding/coverpng.png">
<meta property="og:url" content="https://jameelahmadvp.github.io/jameel-anmol-wedding/">
<meta property="og:type" content="website">
<meta name="theme-color" content="#fff7e8">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #fff7e8;
}

body {
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}

#book {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  height: 100dvh;
  overflow: hidden;
  background: #fff7e8;
  touch-action: none;
  user-select: none;
}

.page {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: #fff7e8;
  isolation: isolate;
}

.page.active {
  display: flex;
}

.page::before {
  content: "";
  position: absolute;
  inset: -25px;
  z-index: -2;
  background-image: var(--page-image);
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;
  filter: blur(18px);
  opacity: .42;
  transform: scale(1.05);
}

.page::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background: rgba(255,247,232,.30);
}

.page img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
  pointer-events: none;
  -webkit-user-drag: none;
}

/* Noticeable cover shake */
.page.cover.active img {
  animation: coverShake 3.2s ease-in-out 2s infinite;
  transform-origin: center;
}

@keyframes coverShake {
  0%, 58%, 100% {
    transform: translateX(0) rotate(0) scale(1);
  }
  62% {
    transform: translateX(-12px) rotate(-1deg) scale(.99);
  }
  66% {
    transform: translateX(12px) rotate(1deg) scale(.99);
  }
  70% {
    transform: translateX(-10px) rotate(-.8deg) scale(.995);
  }
  74% {
    transform: translateX(10px) rotate(.8deg) scale(.995);
  }
  78% {
    transform: translateX(-5px) rotate(-.3deg);
  }
  82% {
    transform: translateX(5px) rotate(.3deg);
  }
  86% {
    transform: translateX(0) rotate(0) scale(1);
  }
}

@media (prefers-reduced-motion: reduce) {
  .page.cover.active img {
    animation: none;
  }
}
</style>
</head>

<body>
<main id="book">

  <section class="page cover active">
    <img src="Page%201.png" alt="Wedding invitation cover">
  </section>

  <section class="page">
    <img src="Page%202.png" alt="Baraat invitation">
  </section>

  <section class="page">
    <img src="Page%203.png" alt="Walima invitation">
  </section>

</main>

<script>
const book = document.getElementById("book");
const pages = Array.from(document.querySelectorAll(".page"));
let currentPage = 0;
let startX = 0;
let startY = 0;
let pointerStart = false;

pages.forEach((page) => {
  const img = page.querySelector("img");
  page.style.setProperty(
    "--page-image",
    'url("' + img.getAttribute("src") + '")'
  );

  const preload = new Image();
  preload.src = img.src;
});

function showPage(index) {
  if (index < 0 || index >= pages.length) return;

  pages[currentPage].classList.remove("active");
  currentPage = index;
  pages[currentPage].classList.add("active");
}

/* Swipe in either direction */
book.addEventListener("pointerdown", function(event) {
  startX = event.clientX;
  startY = event.clientY;
  pointerStart = true;
}, { passive: true });

book.addEventListener("pointerup", function(event) {
  if (!pointerStart) return;
  pointerStart = false;

  const diffX = event.clientX - startX;
  const diffY = event.clientY - startY;

  if (Math.abs(diffX) < 35) return;
  if (Math.abs(diffX) <= Math.abs(diffY)) return;

  if (diffX < 0) {
    // Swipe left: next page
    showPage(currentPage + 1);
  } else {
    // Swipe right: previous page
    showPage(currentPage - 1);
  }
}, { passive: true });

book.addEventListener("pointercancel", function() {
  pointerStart = false;
});

document.addEventListener("keydown", function(event) {
  if (event.key === "ArrowRight" || event.key === "ArrowDown") {
    showPage(currentPage + 1);
  }

  if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
    showPage(currentPage - 1);
  }
});
</script>
</body>
</html>
