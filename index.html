<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#eeece9">
<title>Jameel Ahmad & Anmol Fatima | Wedding Invitation</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500;600;700&family=Cormorant+Garamond&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

:root{
  --ink:#302b29;
  --silver:#bdb8b2;
  --paper:#fffefa;
}

body{
  margin:0;
  background:#eeece9;
  color:var(--ink);
  font-family:'Montserrat',Arial,sans-serif;
}

.shell{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px 12px;
}

.top{
  font-size:10px;
  letter-spacing:4px;
  color:#777;
  margin-bottom:18px;
  text-align:center;
}

.book{
  width:min(90vw,410px);
  height:min(132vw,590px);
  min-height:440px;
  max-height:70vh;
  perspective:1500px;
}

.page{
  width:100%;
  height:100%;
  position:relative;
  background:var(--paper);
  border:1px solid #aaa;
  box-shadow:0 12px 28px #00000018;
  overflow:hidden;
  transform-origin:left center;
}

.page.turning{
  animation:turn .48s ease;
}

@keyframes turn{
  0%{transform:rotateY(0);opacity:1}
  45%{transform:rotateY(-12deg);opacity:.7}
  100%{transform:rotateY(0);opacity:1}
}

.page:before{
  content:"";
  position:absolute;
  inset:10px;
  border:1px solid #d2ceca;
  pointer-events:none;
  z-index:2;
}

.page:after{
  content:"";
  position:absolute;
  inset:17px;
  border:1px solid #eeebe7;
  pointer-events:none;
  z-index:2;
}

.content{
  position:absolute;
  inset:19px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:24px 17px;
  overflow:hidden;
}

.content>*{
  position:relative;
  z-index:1;
}

.cover{
  color:white;
  background:
    linear-gradient(180deg,#17110c12,#17110c52),
    url("angan-scene.jpg") center/cover no-repeat;
}

.cover:before,.cover:after{
  border-color:#e0d1b6;
}

.kicker{
  font-size:10px;
  letter-spacing:2px;
  text-transform:uppercase;
  line-height:1.8;
}

.arabic{
  font-family:serif;
  font-size:24px;
  line-height:1.8;
  margin-bottom:19px;
}

.name{
  font-family:'Great Vibes',cursive;
  font-size:clamp(39px,10vw,49px);
  line-height:1.25;
  font-weight:400;
  margin:10px 0;
}

.cover .name{
  font-size:clamp(42px,10vw,52px);
  text-shadow:0 2px 10px #0006;
}

.with{
  font-size:13px;
  font-weight:600;
  margin:5px 0;
}

.rule{
  width:105px;
  height:1px;
  background:currentColor;
  opacity:.55;
  margin:14px auto;
}

.copy{
  font-size:12px;
  line-height:1.9;
  max-width:290px;
  margin:5px 0;
}

.hint{
  margin-top:27px;
  font-size:9px;
  letter-spacing:2px;
}

.script-title{
  font-family:'Great Vibes',cursive;
  font-size:38px;
  line-height:1.2;
  margin:8px 0 16px;
  font-weight:400;
}

.event-date{
  font-size:13px;
  line-height:1.8;
  margin:8px 0;
}

.event-time{
  font-size:13px;
  margin:4px 0 17px;
}

.venue-label{
  font-size:10px;
  letter-spacing:2px;
  text-transform:uppercase;
}

.venue{
  font-family:'Cormorant Garamond',serif;
  font-size:25px;
  line-height:1.25;
  margin:9px 0;
}

.address{
  font-size:12px;
  line-height:1.8;
}

.inner-photo{
  background:
    linear-gradient(#fffefaeb,#fffefaeb),
    url("angan-scene.jpg") center/cover no-repeat;
}

.map,.rsvp{
  display:inline-block;
  margin-top:17px;
  padding:10px 16px;
  border:1px solid #aaa;
  color:#444;
  text-decoration:none;
  font-size:9px;
  letter-spacing:1.5px;
}

.controls{
  width:min(90vw,410px);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-top:18px;
}

button{
  padding:11px 12px;
  background:#fff;
  border:1px solid #aaa;
  color:#444;
  font-size:9px;
  letter-spacing:1px;
  cursor:pointer;
}

button:disabled{
  opacity:.3;
  cursor:default;
}

.counter{
  font-size:9px;
  letter-spacing:1px;
  color:#666;
  text-align:center;
}

.footer{
  margin-top:16px;
  font-size:9px;
  letter-spacing:2px;
  color:#888;
  text-align:center;
}

@media(max-width:380px){
  .book{
    width:92vw;
    height:128vw;
    min-height:420px;
  }

  .content{padding:19px 12px}
  .name{font-size:38px}
  .cover .name{font-size:42px}
  .arabic{font-size:21px}
  .script-title{font-size:33px}
  .copy{font-size:11px}
  .venue{font-size:24px}
  button{padding:9px 8px}
}

@media(prefers-reduced-motion:reduce){
  .page.turning{animation:none}
}
</style>
</head>

<body>
<main class="shell">

  <div class="top">WEDDING INVITATION</div>

  <div class="book">
    <section class="page" id="page" aria-label="Wedding invitation page">
      <div class="content" id="content"></div>
    </section>
  </div>

  <nav class="controls" aria-label="Book navigation">
    <button id="prev" disabled>← PREVIOUS</button>
    <div class="counter" id="counter">COVER · 1 / 5</div>
    <button id="next">NEXT →</button>
  </nav>

  <div class="footer">JAMEEL AHMAD &amp; ANMOL FATIMA</div>
</main>

<script>
const pages = [
{
  label:"COVER",
  cover:true,
  html:`
    <div class="arabic">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
    <div class="kicker">Wedding Invitation</div>
    <p class="copy">With the blessings of our families</p>
    <div class="name">Jameel Ahmad</div>
    <div class="with">With</div>
    <div class="name">Anmol Fatima</div>
    <div class="rule"></div>
    <p class="copy">Together with love and prayers</p>
    <p class="copy">2nd &amp; 3rd January, 2027</p>
    <div class="hint">OPEN YOUR INVITATION</div>
  `
},
{
  label:"INVITATION",
  html:`
    <div class="arabic">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
    <p class="copy"><b>Request the pleasure of your company</b></p>
    <div class="script-title">Wedding Ceremony</div>
    <p class="copy">to celebrate the wedding of</p>
    <div class="name">Jameel Ahmad</div>
    <div class="with">With</div>
    <div class="name">Anmol Fatima</div>
    <div class="rule"></div>
    <p class="copy">
      Your presence and prayers will make<br>
      our celebration truly special.
    </p>
  `
},
{
  label:"BARAAT",
  photo:true,
  html:`
    <div class="kicker">The Wedding Celebration</div>
    <div class="script-title">Baraat</div>
    <div class="rule"></div>
    <div class="event-date">Saturday, 2nd January, 2027</div>
    <div class="event-time">6:00 PM</div>
    <div class="venue-label">Venue</div>
    <div class="venue">Couples Marquee</div>
    <div class="address">
      Opposite Expo Center<br>
      Johar Town, Lahore
    </div>
    <a class="map" target="_blank" rel="noopener"
       href="https://www.google.com/maps/search/?api=1&query=Couples+Marquee+opposite+Expo+Center+Johar+Town+Lahore">
       VIEW LOCATION
    </a>
  `
},
{
  label:"WALIMA",
  photo:true,
  html:`
    <div class="kicker">The Reception</div>
    <div class="script-title">Walima</div>
    <div class="rule"></div>
    <div class="event-date">Sunday, 3rd January, 2027</div>
    <div class="event-time">6:30 PM</div>
    <div class="venue-label">Venue</div>
    <div class="venue">Aiwan-e-Akbari</div>
    <div class="address">
      Ferozpur Road<br>
      Lahore
    </div>
    <a class="map" target="_blank" rel="noopener"
       href="https://www.google.com/maps/search/?api=1&query=Aiwan-e-Akbari+Ferozpur+Road+Lahore">
       VIEW LOCATION
    </a>
  `
},
{
  label:"BLESSINGS",
  html:`
    <div class="arabic">الحمد لله</div>
    <div class="script-title">With Love &amp; Duas</div>
    <div class="rule"></div>
    <p class="copy">
      We look forward to celebrating<br>
      these beautiful moments with you.
    </p>
    <div class="name">Jameel &amp; Anmol</div>
    <a class="rsvp" target="_blank" rel="noopener"
       href="https://wa.me/?text=Assalam-o-Alaikum%2C%20I%20would%20like%20to%20respond%20to%20the%20wedding%20invitation%20of%20Jameel%20Ahmad%20and%20Anmol%20Fatima.">
       RSVP ON WHATSAPP
    </a>
  `
}
];

let current=0;
let busy=false;

const page=document.getElementById("page");
const content=document.getElementById("content");
const counter=document.getElementById("counter");
const prev=document.getElementById("prev");
const next=document.getElementById("next");

function render(){
  const item=pages[current];

  content.className="content";
  if(item.cover) content.classList.add("cover");
  if(item.photo) content.classList.add("inner-photo");

  content.innerHTML=item.html;

  counter.textContent=
    `${item.label} · ${current+1} / ${pages.length}`;

  prev.disabled=current===0;
  next.disabled=current===pages.length-1;
  next.textContent=current===pages.length-1?"END":"NEXT →";
}

function turn(direction){
  if(busy)return;

  const target=current+direction;
  if(target<0 || target>=pages.length)return;

  busy=true;
  page.classList.remove("turning");
  void page.offsetWidth;
  page.classList.add("turning");

  setTimeout(()=>{
    current=target;
    render();
    busy=false;
  },230);

  setTimeout(()=>{
    page.classList.remove("turning");
  },500);
}

next.addEventListener("click",()=>turn(1));
prev.addEventListener("click",()=>turn(-1));

let startX=0;

page.addEventListener("touchstart",e=>{
  startX=e.changedTouches[0].clientX;
},{passive:true});

page.addEventListener("touchend",e=>{
  const delta=e.changedTouches[0].clientX-startX;
  if(Math.abs(delta)>55)turn(delta<0?1:-1);
},{passive:true});

document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight")turn(1);
  if(e.key==="ArrowLeft")turn(-1);
});

render();
</script>
</body>
</html>
