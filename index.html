<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Jameel & Anmol — Wedding Invitation</title>

  <!-- WhatsApp Link Preview -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Jameel Ahmad & Anmol Fatima — Wedding Invitation">
  <meta property="og:description" content="You are cordially invited to celebrate the wedding of Jameel Ahmad and Anmol Fatima.">
  <meta property="og:image" content="https://jameelahmadvp.github.io/jameel-anmol-wedding/whatsapp-cover.png">
  <meta property="og:image:alt" content="Jameel and Anmol Wedding Invitation Cover">
  <meta property="og:url" content="https://jameelahmadvp.github.io/jameel-anmol-wedding/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#211912">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #211912;
      overscroll-behavior: none;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      touch-action: pan-y;
      user-select: none;
      -webkit-user-select: none;
    }

    .book {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #211912;
    }

    .page {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: none;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #211912;
    }

    .page.active {
      display: flex;
      animation: pageAppear 0.35s ease;
    }

    .page img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center center;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    /* Subtle movement on the first cover only */
    .cover.active img {
      animation: coverShake 3s ease-in-out infinite;
    }

    @keyframes coverShake {
      0%, 72%, 100% {
        transform: translateX(0) rotate(0);
      }

      74% {
        transform: translateX(-3px) rotate(-0.25deg);
      }

      76% {
        transform: translateX(3px) rotate(0.25deg);
      }

      78% {
        transform: translateX(-3px) rotate(-0.2deg);
      }

      80% {
        transform: translateX(3px) rotate(0.2deg);
      }

      82% {
        transform: translateX(0) rotate(0);
      }
    }

    @keyframes pageAppear {
      from {
        opacity: 0.65;
      }

      to {
        opacity: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .cover.active img {
        animation: none;
      }

      .page.active {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main class="book" id="book">

    <section class="page cover active">
      <img
        src="Page%201.png"
        alt="Wedding invitation cover"
        draggable="false"
      >
    </section>

    <section class="page">
      <img
        src="Page%202.png"
        alt="Baraat invitation"
        draggable="false"
      >
    </section>

    <section class="page">
      <img
        src="Page%203.png"
        alt="Walima invitation"
        draggable="false"
      >
    </section>

  </main>

  <script>
    (() => {
      const pages = Array.from(document.querySelectorAll(".page"));
      const book = document.getElementById("book");

      let currentPage = 0;
      let startX = 0;
      let startY = 0;
      let startTime = 0;

      function showPage(index) {
        if (index < 0 || index >= pages.length) return;

        currentPage = index;

        pages.forEach((page, i) => {
          page.classList.toggle("active", i === currentPage);
          page.setAttribute(
            "aria-hidden",
            i === currentPage ? "false" : "true"
          );
        });
      }

      function nextPage() {
        if (currentPage < pages.length - 1) {
          showPage(currentPage + 1);
        }
      }

      function previousPage() {
        if (currentPage > 0) {
          showPage(currentPage - 1);
        }
      }

      book.addEventListener("touchstart", function (event) {
        if (!event.changedTouches.length) return;

        const touch = event.changedTouches[0];

        startX = touch.clientX;
        startY = touch.clientY;
        startTime = Date.now();
      }, { passive: true });

      book.addEventListener("touchend", function (event) {
        if (!event.changedTouches.length) return;

        const touch = event.changedTouches[0];
        const differenceX = touch.clientX - startX;
        const differenceY = touch.clientY - startY;
        const elapsed = Date.now() - startTime;

        if (
          Math.abs(differenceX) > 45 &&
          Math.abs(differenceX) > Math.abs(differenceY) * 1.2 &&
          elapsed < 1000
        ) {
          if (differenceX < 0) {
            nextPage();
          } else {
            previousPage();
          }
        }
      }, { passive: true });

      /* Desktop mouse swipe support */
      let mouseDown = false;
      let mouseStartX = 0;
      let mouseStartY = 0;

      book.addEventListener("mousedown", function (event) {
        mouseDown = true;
        mouseStartX = event.clientX;
        mouseStartY = event.clientY;
      });

      window.addEventListener("mouseup", function (event) {
        if (!mouseDown) return;

        mouseDown = false;

        const differenceX = event.clientX - mouseStartX;
        const differenceY = event.clientY - mouseStartY;

        if (
          Math.abs(differenceX) > 45 &&
          Math.abs(differenceX) > Math.abs(differenceY)
        ) {
          if (differenceX < 0) {
            nextPage();
          } else {
            previousPage();
          }
        }
      });

      /* Keyboard support */
      document.addEventListener("keydown", function (event) {
        if (event.key === "ArrowLeft") {
          previousPage();
        } else if (event.key === "ArrowRight") {
          nextPage();
        }
      });

      /* Prevent image dragging */
      book.addEventListener("dragstart", function (event) {
        event.preventDefault();
      });

      showPage(0);
    })();
  </script>
</body>
</html>
